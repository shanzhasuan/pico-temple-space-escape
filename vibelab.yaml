      "description": "戴上头显，从角色视角进入古老神庙，在石道、丛林、峡谷木桥与雕刻侧廊之间连续奔跑。道路会不断向前展开，你需要观察金币路线、路口箭头和前方机关，在三条路线之间切换，跳过倒木、火焰与断路，滑铲穿过低矮石门。速度会随进程逐渐增加，轻微失误会让身后的守卫逼近，失败后可回头查看守卫，重开或返回选关继续挑战。四个区域采用不同的环境素材，最终目标是穿过连续机关抵达黄金终点门。


        - 四关图文选择：丛林遗迹、峡谷栈桥、机关回廊、圣坛逃脱，可从选定区域开始。

        - 3D 障碍与动态火焰：倒木、雕刻石门、石块、断路和火盆结合不同动作；火舌会摆动伸缩，火星持续上升。

        - 金币与守卫反馈：收集金币、记录分数与最佳成绩，脚步、跳跃、滑铲、金币和守卫吼声提供声音提示。

        - 坐姿与舒适选项：提供坐姿校准、稳定视点与转弯遮罩，可按自己的体验选择舒适模式。


        操作方式：自动向前奔跑；摇杆左右换道或按路口箭头确认转向；扳机、A/X 或摇杆向上跳跃；握键或摇杆向下滑铲；B/Y 暂停。选关后点“开始游戏”或“开始本关”进入赛道。适合坐姿体验与短时跑酷挑战，无需真实跳跃。",
